<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img"><title>Engine overview</title><desc>main calls App::initialize, App::run and App::shutdown in order. App::run loops while the window is open: Window::pollEvents, App::update, App::render, Window::swapBuffers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box > rect { fill: #F7F6F2; stroke: #B4B2A9; }
.c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #888780; }
.c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #BA7517; }
.c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g class="c-gray"><rect x="270" y="40" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">main()</text></g>
<path d="M340 84 L340 118" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M340 100 L130 100 L130 118" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M340 100 L550 100 L550 118" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="120" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="138" text-anchor="middle" dominant-baseline="central">1 · App::initialize</text><text class="ts" x="130" y="158" text-anchor="middle" dominant-baseline="central">See diagram 2</text></g>
<g class="box"><rect x="250" y="120" width="180" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central">2 · App::run</text><text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central">Frame loop below</text>
<g class="box"><rect x="460" y="120" width="180" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="550" y="138" text-anchor="middle" dominant-baseline="central">3 · App::shutdown</text><text class="ts" x="550" y="158" text-anchor="middle" dominant-baseline="central">Cleans up, closes</text>
<line x1="340" y1="176" x2="340" y2="198" class="arr" marker-end="url(#arrow)"/>
<rect x="230" y="200" width="220" height="300" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts" x="340" y="222" text-anchor="middle">While the window is open</text>
<g class="box"><rect x="250" y="238" width="180" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="260" text-anchor="middle" dominant-baseline="central">Window::pollEvents</text>
<g class="c-purple"><rect x="250" y="302" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="320" text-anchor="middle" dominant-baseline="central">App::update</text><text class="ts" x="340" y="340" text-anchor="middle" dominant-baseline="central">See diagram 3</text></g>
<g class="c-purple"><rect x="250" y="378" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="396" text-anchor="middle" dominant-baseline="central">App::render</text><text class="ts" x="340" y="416" text-anchor="middle" dominant-baseline="central">See diagram 4</text></g>
<g class="box"><rect x="250" y="446" width="180" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="468" text-anchor="middle" dominant-baseline="central">Window::swapBuffers</text>
<line x1="340" y1="282" x2="340" y2="300" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="358" x2="340" y2="376" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="434" x2="340" y2="444" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="528" text-anchor="middle">↻ back to pollEvents; deltaTime comes from Window::getTime</text>
<rect class="c-purple" x="236" y="548" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="256" y="559">Expanded in its own diagram</text>
</svg>
