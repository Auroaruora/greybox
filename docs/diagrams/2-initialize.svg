<svg xmlns="http://www.w3.org/2000/svg" width="680" height="648" viewBox="0 0 680 648" role="img"><title>App::initialize calls</title><desc>App::initialize calls, in order: Window::create, SceneRenderer::initialize, SpriteRenderer::initialize, Cursor::initialize, Input::initialize, Bindings::setDefaults, App::addScreen for the room and the hill.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box > rect { fill: #F7F6F2; stroke: #B4B2A9; }
.c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #888780; }
.c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #BA7517; }
.c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g class="c-purple"><rect x="200" y="30" width="280" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">App::initialize</text></g>
<line x1="340" y1="74" x2="340" y2="92" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="160" y="94" width="360" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="116" text-anchor="middle" dominant-baseline="central">Window::create(1280, 720, title)</text>
<line x1="340" y1="138" x2="340" y2="154" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="160" y="156" width="360" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">SceneRenderer::initialize()</text><text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central">See 2b</text></g>
<line x1="340" y1="212" x2="340" y2="228" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="160" y="230" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="248" text-anchor="middle" dominant-baseline="central">SpriteRenderer::initialize()</text><text class="ts" x="340" y="268" text-anchor="middle" dominant-baseline="central">ShaderLoader::load(sprite.vert, sprite.frag)</text>
<line x1="340" y1="286" x2="340" y2="302" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="160" y="304" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="322" text-anchor="middle" dominant-baseline="central">Cursor::initialize()</text><text class="ts" x="340" y="342" text-anchor="middle" dominant-baseline="central">Loads the icon textures</text>
<line x1="340" y1="360" x2="340" y2="376" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="160" y="378" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="396" text-anchor="middle" dominant-baseline="central">Input::initialize(window)</text><text class="ts" x="340" y="416" text-anchor="middle" dominant-baseline="central">glfwSetKeyCallback and mouse callbacks</text>
<line x1="340" y1="434" x2="340" y2="450" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="160" y="452" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="470" text-anchor="middle" dominant-baseline="central">Bindings::setDefaults()</text><text class="ts" x="340" y="490" text-anchor="middle" dominant-baseline="central">Input::bind(action, key or button)</text>
<line x1="340" y1="508" x2="340" y2="524" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="160" y="526" width="360" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="544" text-anchor="middle" dominant-baseline="central">App::addScreen(RoomScreen, HillScreen)</text><text class="ts" x="340" y="564" text-anchor="middle" dominant-baseline="central">See 2c</text></g>
<rect class="c-purple" x="236" y="612" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="256" y="623">Expanded in its own diagram</text>
</svg>
