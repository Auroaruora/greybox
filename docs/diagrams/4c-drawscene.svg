<svg xmlns="http://www.w3.org/2000/svg" width="680" height="930" viewBox="0 0 680 930" role="img"><title>SceneRenderer::drawScene</title><desc>SceneRenderer::drawScene clears color and depth, enables depth test and face culling, binds the scene shader, then sets the camera, global data and lights. For each visible shape with a mesh it sets the transform, material, texture map and emissive map and calls Mesh::draw. Finally it unbinds the shader.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box > rect { fill: #F7F6F2; stroke: #B4B2A9; }
.c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #888780; }
.c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #BA7517; }
.c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g class="c-purple"><rect x="130" y="30" width="420" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">SceneRenderer::drawScene(camera, renderData)</text></g>
<line x1="340" y1="74" x2="340" y2="92" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="94" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="116" text-anchor="middle" dominant-baseline="central">glClear(color, depth)</text>
<line x1="340" y1="138" x2="340" y2="148" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="150" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="172" text-anchor="middle" dominant-baseline="central">glEnable(depth test, cull face)</text>
<line x1="340" y1="194" x2="340" y2="204" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="206" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">ShaderProgram::bind()</text>
<line x1="340" y1="250" x2="340" y2="260" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="262" width="420" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="280" text-anchor="middle" dominant-baseline="central">SceneRenderer::setCamera(camera)</text><text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">viewMatrix, projMatrix, cameraPos</text>
<line x1="340" y1="318" x2="340" y2="328" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="330" width="420" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="348" text-anchor="middle" dominant-baseline="central">SceneRenderer::setGlobalData(globalData)</text><text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">ka, kd, ks, ambientLight</text>
<line x1="340" y1="386" x2="340" y2="396" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="398" width="420" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="416" text-anchor="middle" dominant-baseline="central">SceneRenderer::setLights(lights)</text><text class="ts" x="340" y="436" text-anchor="middle" dominant-baseline="central">lights[i] for each enabled light, lightCount</text>
<line x1="340" y1="454" x2="340" y2="470" class="arr" marker-end="url(#arrow)"/>
<rect x="130" y="472" width="420" height="370" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts" x="340" y="494" text-anchor="middle">For each visible shape with a mesh</text>
<g class="box"><rect x="170" y="508" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="526" text-anchor="middle" dominant-baseline="central">SceneRenderer::setTransform(shape)</text><text class="ts" x="350" y="546" text-anchor="middle" dominant-baseline="central">modelMatrix, normalMatrix</text>
<line x1="350" y1="564" x2="350" y2="574" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="576" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="594" text-anchor="middle" dominant-baseline="central">SceneRenderer::setMaterial(shape)</text><text class="ts" x="350" y="614" text-anchor="middle" dominant-baseline="central">cDiffuse, cSpecular, cEmissive, shininess</text>
<line x1="350" y1="632" x2="350" y2="642" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="644" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="662" text-anchor="middle" dominant-baseline="central">SceneRenderer::setTextureMap(shape)</text><text class="ts" x="350" y="682" text-anchor="middle" dominant-baseline="central">Its texture, or the placeholder</text>
<line x1="350" y1="700" x2="350" y2="710" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="712" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="730" text-anchor="middle" dominant-baseline="central">SceneRenderer::setEmissiveMap(shape)</text><text class="ts" x="350" y="750" text-anchor="middle" dominant-baseline="central">e.g. the monitor's desktop texture</text>
<line x1="350" y1="768" x2="350" y2="778" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="780" width="360" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="802" text-anchor="middle" dominant-baseline="central">Mesh::draw()</text>
<path d="M170 802 L152 802 L152 536 L168 536" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="842" x2="340" y2="858" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="860" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="882" text-anchor="middle" dominant-baseline="central">ShaderProgram::unbind()</text>
</svg>
