<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1148" viewBox="0 0 680 1148" role="img"><title>SceneRenderer::drawScene</title><desc>SceneRenderer::drawScene clears color and depth, draws the sky when the lighting state has one, takes the ShadingProgram for the scene (PhongProgram or ToonProgram), enables depth test and face culling and binds the program. ShadingProgram::setFrame sets the camera, the scene data through the subclass, and the lights. For each visible shape with a mesh, setShape sets the transform, the material through the subclass, the texture map and the emissive map, then Mesh::draw. Finally the program is unbound.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box > rect { fill: #F7F6F2; stroke: #B4B2A9; }
.c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #888780; }
.c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #BA7517; }
.c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g class="c-purple"><rect x="130" y="30" width="420" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">SceneRenderer::drawScene(camera, renderData)</text></g>
<line x1="340" y1="74" x2="340" y2="92" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="94" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="116" text-anchor="middle" dominant-baseline="central">glClear(color, depth)</text>
<line x1="340" y1="138" x2="340" y2="148" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="150" width="420" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="168" text-anchor="middle" dominant-baseline="central">SceneRenderer::drawSky(camera, renderData)</text><text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">If the lighting state has a sky: sky.frag on a full-screen quad</text>
<line x1="340" y1="206" x2="340" y2="216" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="218" width="420" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="236" text-anchor="middle" dominant-baseline="central">SceneRenderer::getProgram(globalData.shading)</text><text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">PhongProgram for the room, ToonProgram for the hill</text>
<line x1="340" y1="274" x2="340" y2="284" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="286" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="308" text-anchor="middle" dominant-baseline="central">glEnable(depth test, cull face)</text>
<line x1="340" y1="330" x2="340" y2="340" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="342" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="364" text-anchor="middle" dominant-baseline="central">ShadingProgram::bind()</text>
<line x1="340" y1="386" x2="340" y2="400" class="arr" marker-end="url(#arrow)"/>
<rect x="130" y="402" width="420" height="246" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="340" y="426" text-anchor="middle">ShadingProgram::setFrame(camera, renderData)</text>
<g class="box"><rect x="170" y="440" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="458" text-anchor="middle" dominant-baseline="central">ShadingProgram::setCamera(camera)</text><text class="ts" x="350" y="478" text-anchor="middle" dominant-baseline="central">viewMatrix, projMatrix, cameraPos</text>
<line x1="350" y1="496" x2="350" y2="506" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="508" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="526" text-anchor="middle" dominant-baseline="central">setSceneData(renderData), per subclass</text><text class="ts" x="350" y="546" text-anchor="middle" dominant-baseline="central">Phong: ka, kd, ks, ambient; Toon: ambient, toonShade</text>
<line x1="350" y1="564" x2="350" y2="574" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="576" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="594" text-anchor="middle" dominant-baseline="central">ShadingProgram::setLights(lights)</text><text class="ts" x="350" y="614" text-anchor="middle" dominant-baseline="central">lights[i] for each enabled light, lightCount</text>
<line x1="340" y1="648" x2="340" y2="662" class="arr" marker-end="url(#arrow)"/>
<rect x="130" y="664" width="420" height="392" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts" x="340" y="686" text-anchor="middle">For each visible shape with a mesh</text>
<text class="th" x="340" y="708" text-anchor="middle">ShadingProgram::setShape(shape)</text>
<g class="box"><rect x="170" y="724" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="742" text-anchor="middle" dominant-baseline="central">ShadingProgram::setTransform(shape)</text><text class="ts" x="350" y="762" text-anchor="middle" dominant-baseline="central">modelMatrix, normalMatrix</text>
<line x1="350" y1="780" x2="350" y2="790" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="792" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="810" text-anchor="middle" dominant-baseline="central">setMaterial(shape), per subclass</text><text class="ts" x="350" y="830" text-anchor="middle" dominant-baseline="central">cDiffuse, cSpecular, cEmissive, shininess</text>
<line x1="350" y1="848" x2="350" y2="858" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="860" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="878" text-anchor="middle" dominant-baseline="central">ShadingProgram::setTextureMap(shape)</text><text class="ts" x="350" y="898" text-anchor="middle" dominant-baseline="central">Its texture, or the placeholder</text>
<line x1="350" y1="916" x2="350" y2="926" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="928" width="360" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="946" text-anchor="middle" dominant-baseline="central">ShadingProgram::setEmissiveMap(shape)</text><text class="ts" x="350" y="966" text-anchor="middle" dominant-baseline="central">e.g. the monitor's wallpaper</text>
<line x1="350" y1="984" x2="350" y2="994" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="170" y="996" width="360" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="350" y="1018" text-anchor="middle" dominant-baseline="central">Mesh::draw()</text>
<path d="M170 1018 L152 1018 L152 752 L168 752" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="1056" x2="340" y2="1072" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="1074" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="1096" text-anchor="middle" dominant-baseline="central">ShadingProgram::unbind()</text>
</svg>
