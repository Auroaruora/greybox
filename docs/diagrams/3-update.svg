<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img"><title>App::update calls</title><desc>App::update calls, in order: Cursor::update with the window size, Screen::update with delta time, cursor NDC and aspect ratio (expanded in 3b), Cursor::setIcon with the interaction system's icon, and Input::endFrame.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box > rect { fill: #F7F6F2; stroke: #B4B2A9; }
.c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #888780; }
.c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #BA7517; }
.c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g class="c-purple"><rect x="200" y="30" width="280" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">App::update(deltaTime)</text></g>
<line x1="340" y1="74" x2="340" y2="92" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="94" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="116" text-anchor="middle" dominant-baseline="central">Cursor::update(windowSize)</text>
<line x1="340" y1="138" x2="340" y2="154" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="130" y="156" width="420" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">Screen::update(deltaTime, cursorNdc, aspectRatio)</text><text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central">See 3b</text></g>
<line x1="340" y1="212" x2="340" y2="228" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="230" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">Cursor::setIcon(InteractionSystem::getIcon())</text>
<line x1="340" y1="274" x2="340" y2="290" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="130" y="292" width="420" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="340" y="314" text-anchor="middle" dominant-baseline="central">Input::endFrame()</text>
<rect class="c-purple" x="236" y="364" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="256" y="375">Expanded in its own diagram</text>
</svg>
