<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img"><title>SceneRenderer::render</title><desc>Screen::render calls SceneRenderer::render, which calls PostProcessor::begin to bind m_buffers[0], SceneRenderer::drawScene (expanded in 4c), and PostProcessor::end. End starts with source 0 and, for each enabled pass, sets target to 1 minus source, calls Pass::render from m_buffers[source] to m_buffers[target], and sets source to target; then PostProcessor::paintTexture draws m_buffers[source] to the window.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box > rect { fill: #F7F6F2; stroke: #B4B2A9; }
.c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #888780; }
.c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #BA7517; }
.c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g class="c-purple"><rect x="40" y="30" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="170" y="52" text-anchor="middle" dominant-baseline="central">Screen::render(sceneRenderer)</text></g>
<line x1="170" y1="74" x2="170" y2="92" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="40" y="94" width="260" height="56" rx="8" stroke-width="0.5"/></g><text class="th" x="170" y="112" text-anchor="middle" dominant-baseline="central">SceneRenderer::render()</text><text class="ts" x="170" y="132" text-anchor="middle" dominant-baseline="central">(camera, renderData)</text>
<line x1="170" y1="150" x2="170" y2="168" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="40" y="170" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="188" text-anchor="middle" dominant-baseline="central">PostProcessor::begin()</text><text class="ts" x="170" y="208" text-anchor="middle" dominant-baseline="central">m_buffers[0].bind()</text></g>
<line x1="170" y1="226" x2="170" y2="244" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="40" y="246" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="264" text-anchor="middle" dominant-baseline="central">SceneRenderer::drawScene()</text><text class="ts" x="170" y="284" text-anchor="middle" dominant-baseline="central">See 4c</text></g>
<line x1="170" y1="302" x2="170" y2="320" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="40" y="322" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="340" text-anchor="middle" dominant-baseline="central">PostProcessor::end()</text><text class="ts" x="170" y="360" text-anchor="middle" dominant-baseline="central">(viewportSize)</text></g>
<line x1="300" y1="350" x2="328" y2="350" class="arr" marker-end="url(#arrow)"/>
<rect x="330" y="316" width="310" height="232" rx="16" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts" x="485" y="338" text-anchor="middle">source = 0, then for each enabled pass</text>
<g class="c-amber"><rect x="360" y="354" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="490" y="376" text-anchor="middle" dominant-baseline="central">target = 1 - source</text></g>
<line x1="490" y1="398" x2="490" y2="412" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="360" y="414" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="490" y="432" text-anchor="middle" dominant-baseline="central">Pass::render()</text><text class="ts" x="490" y="452" text-anchor="middle" dominant-baseline="central">m_buffers[source] → m_buffers[target]</text></g>
<line x1="490" y1="470" x2="490" y2="484" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="360" y="486" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="490" y="508" text-anchor="middle" dominant-baseline="central">source = target</text></g>
<path d="M360 508 L345 508 L345 376 L358 376" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="548" x2="485" y2="566" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="330" y="568" width="310" height="56" rx="8" stroke-width="0.5"/><text class="th" x="485" y="586" text-anchor="middle" dominant-baseline="central">PostProcessor::paintTexture()</text><text class="ts" x="485" y="606" text-anchor="middle" dominant-baseline="central">m_buffers[source] onto the window</text></g>
<rect class="c-purple" x="150" y="650" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="170" y="661">Expanded in its own diagram</text>
<rect class="c-amber" x="400" y="650" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="420" y="661">Post-processing</text>
</svg>
