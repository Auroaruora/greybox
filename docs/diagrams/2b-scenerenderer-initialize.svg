<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img"><title>SceneRenderer::initialize</title><desc>SceneRenderer::initialize calls ShaderLoader::load with the default shaders, SceneRenderer::loadUniforms and Texture2D::create, then PostProcessor::initialize and PostProcessor::addPass. For each name in LutNames it adds a GradePass, which loads luts/name.cube through LutLoader into a Texture3D; all passes start off. Pass types shown at the side, a plain Pass with one fragment shader, GradePass, or any new Pass subclass, can be given to addPass, which appends them to the m_passes chain.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box > rect { fill: #F7F6F2; stroke: #B4B2A9; }
.c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #888780; }
.c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #BA7517; }
.c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g class="c-purple"><rect x="90" y="30" width="280" height="44" rx="8" stroke-width="0.5"/><text class="th" x="230" y="52" text-anchor="middle" dominant-baseline="central">SceneRenderer::initialize()</text></g>
<line x1="230" y1="74" x2="230" y2="92" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="40" y="94" width="380" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="230" y="116" text-anchor="middle" dominant-baseline="central">ShaderLoader::load(default.vert, default.frag)</text>
<line x1="230" y1="138" x2="230" y2="156" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="40" y="158" width="380" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="230" y="180" text-anchor="middle" dominant-baseline="central">SceneRenderer::loadUniforms()</text>
<line x1="230" y1="202" x2="230" y2="220" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="40" y="222" width="380" height="44" rx="8" stroke-width="0.5"/></g><text class="th" x="230" y="244" text-anchor="middle" dominant-baseline="central">Texture2D::create(1, 1, pixel)</text>
<path d="M230 266 L230 288" fill="none" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="290" width="380" height="300" rx="16" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="230" y="314" text-anchor="middle">PostProcessor</text>
<g class="c-amber"><rect x="60" y="330" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="348" text-anchor="middle" dominant-baseline="central">PostProcessor::initialize()</text><text class="ts" x="230" y="368" text-anchor="middle" dominant-baseline="central">Quad::create(), copy.frag shader</text></g>
<line x1="230" y1="386" x2="230" y2="404" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="60" y="406" width="340" height="44" rx="8" stroke-width="0.5"/><text class="th" x="230" y="428" text-anchor="middle" dominant-baseline="central">for each LutNames: addPass(GradePass)</text></g>
<line x1="230" y1="450" x2="230" y2="486" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="60" y="474">m_passes, runs left to right</text>
<g class="c-amber"><rect x="60" y="488" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="110" y="510" text-anchor="middle" dominant-baseline="central">LUT 1</text></g>
<g class="c-amber"><rect x="180" y="488" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="230" y="510" text-anchor="middle" dominant-baseline="central">LUT 2</text></g>
<rect x="300" y="488" width="100" height="44" rx="8" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="350" y="510" text-anchor="middle" dominant-baseline="central">…</text>
<line x1="160" y1="510" x2="178" y2="510" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="510" x2="298" y2="510" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="230" y="566" text-anchor="middle">One GradePass per name in LutNames, off by default</text>
<text class="th" x="545" y="314" text-anchor="middle">Pass types</text>
<g class="c-amber"><rect x="450" y="330" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="545" y="348" text-anchor="middle" dominant-baseline="central">Pass(name, frag)</text><text class="ts" x="545" y="368" text-anchor="middle" dominant-baseline="central">one .frag, no extra inputs</text></g>
<g class="c-amber"><rect x="450" y="406" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="545" y="426" text-anchor="middle" dominant-baseline="central">GradePass(lutName)</text><text class="ts" x="545" y="448" text-anchor="middle" dominant-baseline="central">grade.frag, luts/&lt;name&gt;.cube</text><text class="ts" x="545" y="466" text-anchor="middle" dominant-baseline="central">LutLoader → Texture3D</text></g>
<rect x="450" y="498" width="190" height="56" rx="8" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="545" y="516" text-anchor="middle" dominant-baseline="central">New Pass subclass</text><text class="ts" x="545" y="536" text-anchor="middle" dominant-baseline="central">its .frag, its inputs</text>
<path d="M450 358 L428 358 L428 526 L450 526" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="428" y1="442" x2="450" y2="442" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="428" y1="428" x2="402" y2="428" class="arr" marker-end="url(#arrow)"/>
</svg>
