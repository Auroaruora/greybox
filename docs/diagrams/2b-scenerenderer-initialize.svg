<line x1="428" y1="162" x2="402" y2="162" class="arr" marker-end="url(#arrow)"/>
<path d="M230 302 L230 388" fill="none" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="390" width="380" height="300" rx="16" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="230" y="414" text-anchor="middle">PostProcessor</text>
<g class="c-amber"><rect x="60" y="430" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="448" text-anchor="middle" dominant-baseline="central">PostProcessor::initialize()</text><text class="ts" x="230" y="468" text-anchor="middle" dominant-baseline="central">Quad::create(), copy.frag shader</text></g>
<line x1="230" y1="486" x2="230" y2="504" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="60" y="506" width="340" height="44" rx="8" stroke-width="0.5"/><text class="th" x="230" y="528" text-anchor="middle" dominant-baseline="central">for each LutNames: addPass(GradePass)</text></g>
<line x1="230" y1="550" x2="230" y2="586" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="60" y="574">m_passes, runs left to right</text>
<g class="c-amber"><rect x="60" y="588" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="110" y="610" text-anchor="middle" dominant-baseline="central">LUT 1</text></g>
<g class="c-amber"><rect x="180" y="588" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="230" y="610" text-anchor="middle" dominant-baseline="central">LUT 2</text></g>
<rect x="300" y="588" width="100" height="44" rx="8" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="350" y="610" text-anchor="middle" dominant-baseline="central">…</text>
<line x1="160" y1="610" x2="178" y2="610" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="610" x2="298" y2="610" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="230" y="666" text-anchor="middle">One GradePass per name in LutNames, off by default</text>
<text class="th" x="545" y="414" text-anchor="middle">Pass types</text>
<g class="c-amber"><rect x="450" y="430" width="190" height="56" rx="8" stroke-width="0.5"/><text class="th" x="545" y="448" text-anchor="middle" dominant-baseline="central">Pass(name, frag)</text><text class="ts" x="545" y="468" text-anchor="middle" dominant-baseline="central">one .frag, no extra inputs</text></g>
<g class="c-amber"><rect x="450" y="506" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="545" y="526" text-anchor="middle" dominant-baseline="central">GradePass(lutName)</text><text class="ts" x="545" y="548" text-anchor="middle" dominant-baseline="central">grade.frag, luts/&lt;name&gt;.cube</text><text class="ts" x="545" y="566" text-anchor="middle" dominant-baseline="central">LutLoader → Texture3D</text></g>
<rect x="450" y="598" width="190" height="56" rx="8" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="545" y="616" text-anchor="middle" dominant-baseline="central">New Pass subclass</text><text class="ts" x="545" y="636" text-anchor="middle" dominant-baseline="central">its .frag, its inputs</text>
<path d="M450 458 L428 458 L428 626 L450 626" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="428" y1="542" x2="450" y2="542" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="428" y1="528" x2="402" y2="528" class="arr" marker-end="url(#arrow)"/>
</svg>
