<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img"><title>SceneRenderer::initialize</title><desc>SceneRenderer::initialize registers one ShadingProgram per ShadingModel, currently PhongProgram, and initializes each: ShaderLoader::load with mesh.vert and the fragment shader of that program, the uniform locations, and a placeholder Texture2D. ShadingProgram holds the camera, light, transform and texture map uniforms; each subclass adds its own fragment shader, global data and material uniforms. Then PostProcessor::initialize and, for each name in LutNames, addPass with a GradePass, which loads luts/name.cube through LutLoader into a Texture3D; all passes start off. Pass types shown at the side, a plain Pass with one fragment shader, GradePass, or any new Pass subclass, can be given to addPass.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box > rect { fill: #F7F6F2; stroke: #B4B2A9; }
.c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #888780; }
.c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
.c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #BA7517; }
.c-amber > .th { fill: #633806; } .c-amber > .ts { fill: #854F0B; }
.c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g class="c-purple"><rect x="90" y="30" width="280" height="44" rx="8" stroke-width="0.5"/><text class="th" x="230" y="52" text-anchor="middle" dominant-baseline="central">SceneRenderer::initialize()</text></g>
<line x1="230" y1="74" x2="230" y2="92" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="94" width="380" height="208" rx="16" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="230" y="118" text-anchor="middle">Shading programs</text>
<g class="c-gray"><rect x="60" y="134" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="230" y="152" text-anchor="middle" dominant-baseline="central">m_programs[Phong] = PhongProgram</text><text class="ts" x="230" y="172" text-anchor="middle" dominant-baseline="central">one entry per ShadingModel</text></g>
<line x1="230" y1="190" x2="230" y2="208" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="60" y="210" width="340" height="72" rx="8" stroke-width="0.5"/><text class="th" x="230" y="230" text-anchor="middle" dominant-baseline="central">for each: ShadingProgram::initialize()</text><text class="ts" x="230" y="252" text-anchor="middle" dominant-baseline="central">ShaderLoader::load(mesh.vert, its .frag)</text><text class="ts" x="230" y="270" text-anchor="middle" dominant-baseline="central">uniform locations, placeholder Texture2D</text></g>
<text class="th" x="545" y="118" text-anchor="middle">Shading types</text>
<g class="c-gray"><rect x="450" y="134" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="545" y="154" text-anchor="middle" dominant-baseline="central">ShadingProgram</text><text class="ts" x="545" y="176" text-anchor="middle" dominant-baseline="central">mesh.vert</text><text class="ts" x="545" y="194" text-anchor="middle" dominant-baseline="central">camera, lights, transform, maps</text></g>
<g class="c-gray"><rect x="450" y="226" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="545" y="246" text-anchor="middle" dominant-baseline="central">PhongProgram</text><text class="ts" x="545" y="268" text-anchor="middle" dominant-baseline="central">phong.frag</text><text class="ts" x="545" y="286" text-anchor="middle" dominant-baseline="central">ka, kd, ks, ambient, material</text></g>
<rect x="450" y="318" width="190" height="56" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="545" y="336" text-anchor="middle" dominant-baseline="central">New subclass</text><text class="ts" x="545" y="356" text-anchor="middle" dominant-baseline="central">its .frag, global data, material</text>
<path d="M450 170 L428 170 L428 346 L450 346" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
